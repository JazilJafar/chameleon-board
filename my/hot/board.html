<!DOCTYPE HTML>
<html>
    <head>
        <title>Hot themed Kanban Board</title>
        <link rel="stylesheet" href="./boards.css"/>
    </head>
    <body>
        <h1>Hot themed Kanban Board</h1>
        <div class="kanban"> 
         <div class="kanban__column">
            <div class="kanban__column-title">Not Started</div>
            <div class="kanban__items">
                <div class="kanban__item-input" contenteditable>make hot tea</div>
                <div class="kanban__dropzone"></div>
            </div>
            <button class="kanban__add-item" type="button">+ Add</button>
         </div>
        </div>
        <script src="./index.js" type="module"></script>
    </body>
</html>
