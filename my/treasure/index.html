<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Treasure themed kanban board for Chameleon board">
    <title>Treasure Kanban Board</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="../../index.html" aria-label="Chameleon Board home">
                <span>Chameleon Board</span>
            </a>

            <a class="back-link" href="../../index.html">
                Back to themes
            </a>
        </header>

        <main>
            <section class="board-heading">
                <div>
                    <h1 id="board-title">Treasure board</h1>
                </div>

                <button class="add-button" id="open-task-modal" type="button">
                    <span aria-hidden="true">+</span>New task
                </button>
            </section>

            <div class="board-toolbar">
                <p id="task-summary">0 tasks on your board</p>
                <p class="toolbar-note">Drag cards to move them between columns</p>
            </div>

            <section class="board" aria-label="Kanban board">
                <div class="column" data-status="todo">
                    <header class="column-heading">
                        <div class="column-title">
                            <span class="column-dot todo-dot" aria-hidden="true"></span>
                            <h2>To Do</h2>
                        </div>
                        <span class="task-count" id="todo-count">0</span>
                    </header>
                    <div class="task-list" id="todo-list"></div>
                </div>
            </section>
        </main>
    </div>

    <dialog class="task-dialog" id="task-dialog" aria-labelled-by="dialog-title">
        <form id="task-form">
            <div class="dialog-heading">
                <div>
                    <h2 id="dialog-title">Add a task</h2>
                </div>

                <button
                    class="icon-button"
                    id="close-task-modal"
                    type="button"
                    aria-label="Close task form"
                >
                    X
                </button>
            </div>

            <label for="task-title">Task name</label>
            <input
                id="task-title"
                name="title"
                type="text"
                placeholder="What needs to be done?"
                maxlength="80"
                required
            >

            <label for="task-description">Description <span>(optional)</span></label>
            <textarea
                id="task-description"
                name="description"
                rows="4"
                maxlength="300"
                placeholder="Add a little more detail..."
            ></textarea>

            <label for="task-status">Column</label>
            <select id="task-status" name="status">
                <option value="todo">To do</option>
                <option value="progress">In progress</option>
                <option value="done">Done</option>
            </select>

            <div class="dialog-actions">
                <button class="cancel-button" id="cancel-task" type="button">
                    Cancel
                </button>
                <button class="save-button" type="submit">Save task</button>
            </div>
        </form>
    </dialog>
</body>
</html>
